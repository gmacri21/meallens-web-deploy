services:
  meallens-web:
    image: nginx:1.27-alpine
    container_name: meallens-web
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - default
      - batchline_default
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache git >/dev/null 2>&1;
        git clone --depth 1 --branch main https://github.com/gmacri21/meallens-web-deploy /tmp/repo &&
        cp -r /tmp/repo/dist/. /usr/share/nginx/html/ &&
        cp /tmp/repo/nginx.conf /etc/nginx/conf.d/default.conf &&
        rm -rf /tmp/repo &&
        exec nginx -g 'daemon off;'
networks:
  batchline_default:
    external: true
